name: Build libclc

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-libclc:
    name: Build libclc
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Prepare environment
        run: |
          sudo apt-get update
      
          sudo apt-get install -y \
            ca-certificates \
            curl \
            gnupg \
            unzip \
            build-essential \
            flex \
            bison \
            ninja-build \
            pkg-config \
            glslang-tools \
            meson \
            python3-mako \
            python3-markdown
      
          # Install a current CMake from Kitware
          curl -fsSL https://apt.kitware.com/keys/kitware-archive-latest.asc \
            | gpg --dearmor \
            | sudo tee /usr/share/keyrings/kitware-archive-keyring.gpg > /dev/null
      
          echo "deb [signed-by=/usr/share/keyrings/kitware-archive-keyring.gpg] https://apt.kitware.com/ubuntu/ $(. /etc/os-release && echo "$VERSION_CODENAME") main" \
            | sudo tee /etc/apt/sources.list.d/kitware.list
      
          sudo apt-get update
          sudo apt-get install -y cmake
      
          cmake --version
          ninja --version

      - name: Install Android NDK
        run: |
          chmod +x scripts/install_ndk.sh
          scripts/install_ndk.sh

      - name: Show build environment
        run: |
          echo "ANDROID_NDK_HOME=${ANDROID_NDK_HOME}"
          echo "MATRIX_ARCH=${MATRIX_ARCH:-unknown}"

          "${ANDROID_NDK_HOME}/ndk-build" --version || true

      - name: Clone LLVM
        run: |
          git clone \
            --depth=1 \
            https://github.com/llvm/llvm-project.git \
            llvm-project

      - name: Configure LLVM
        run: |
          cmake \
            -S llvm-project/llvm \
            -B llvm-build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/opt/llvm \
            -DLLVM_ENABLE_PROJECTS="clang" \
            -DLLVM_ENABLE_RUNTIMES="libclc" \
            -DLLVM_RUNTIME_TARGETS="spirv64-unknown-unknown" \
            -DRUNTIMES_spirv64-unknown-unknown_LLVM_ENABLE_RUNTIMES=libclc

      - name: Build libclc
        run: |
          ninja \
            -C llvm-build \
            -j"$(nproc)" \
            libclc

      - name: Install libclc
        run: |
          sudo ninja \
            -C llvm-build \
            install

      - name: Verify installation
        run: |
          export PKG_CONFIG_PATH="/opt/llvm/lib/pkgconfig:/opt/llvm/share/pkgconfig:${PKG_CONFIG_PATH:-}"

          pkg-config --modversion libclc
          pkg-config --variable=prefix libclc

          find /opt/llvm -maxdepth 3 -type f | sort | head -200

      - name: Package libclc
        run: |
          mkdir -p package

          sudo tar \
            -C /opt \
            -czf package/libclc-linux-x86_64.tar.gz \
            llvm

          sudo chown \
            "$USER:$USER" \
            package/libclc-linux-x86_64.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libclc-linux-x86_64
          path: package/libclc-linux-x86_64.tar.gz
          if-no-files-found: error

      - name: Upload release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: package/libclc-linux-x86_64.tar.gz
          generate_release_notes: true
