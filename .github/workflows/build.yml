name: Build LLVM + libclc

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  LLVM_VERSION: "22"
  LLVM_TAG: "llvmorg-22.1.8"

jobs:
  # ==========================================================================
  # LLVM + Clang for Android x86_64
  # ==========================================================================
  build-llvm-android:
    name: Build LLVM + Clang for Android x86_64
    runs-on: ubuntu-24.04

    env:
      ANDROID_ABI: x86_64
      ANDROID_PLATFORM: android-29
      INSTALL_PREFIX: "${{ github.workspace }}/llvm-android-install"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare environment
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            ca-certificates \
            curl \
            gnupg \
            git \
            unzip \
            build-essential \
            ninja-build \
            pkg-config \
            python3 \
            python3-mako \
            python3-markdown

          # Install current CMake from Kitware
          curl -fsSL https://apt.kitware.com/keys/kitware-archive-latest.asc \
            | gpg --dearmor \
            | sudo tee /usr/share/keyrings/kitware-archive-keyring.gpg > /dev/null

          echo "deb [signed-by=/usr/share/keyrings/kitware-archive-keyring.gpg] https://apt.kitware.com/ubuntu/ $(. /etc/os-release && echo "$VERSION_CODENAME") main" \
            | sudo tee /etc/apt/sources.list.d/kitware.list

          sudo apt-get update
          sudo apt-get install -y cmake

          cmake --version
          ninja --version

      - name: Install Android NDK
        run: |
          chmod +x scripts/install_ndk.sh
          scripts/install_ndk.sh

      - name: Show Android environment
        run: |
          echo "ANDROID_NDK_HOME=${ANDROID_NDK_HOME}"
          echo "ANDROID_ABI=${ANDROID_ABI}"
          echo "ANDROID_PLATFORM=${ANDROID_PLATFORM}"

          "${ANDROID_NDK_HOME}/ndk-build" --version || true

      - name: Clone LLVM
        run: |
          git clone \
            --branch "${LLVM_TAG}" \
            --single-branch \
            --depth=1 \
            https://github.com/llvm/llvm-project.git

      - name: Configure LLVM
        run: |
          cmake \
            -S llvm-project/llvm \
            -B llvm-build \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="${ANDROID_NDK_HOME}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI="${ANDROID_ABI}" \
            -DANDROID_PLATFORM="${ANDROID_PLATFORM}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${INSTALL_PREFIX}" \
            \
            -DLLVM_ENABLE_PROJECTS="clang" \
            -DLLVM_ENABLE_RUNTIMES="" \
            \
            -DLLVM_TARGETS_TO_BUILD="X86;SPIRV" \
            \
            -DLLVM_ENABLE_ZLIB=OFF \
            -DLLVM_ENABLE_ZSTD=OFF \
            -DLLVM_ENABLE_LIBXML2=OFF

      - name: Build LLVM + Clang
        run: |
          cmake --build llvm-build --parallel 12

      - name: Install LLVM + Clang
        run: |
          cmake --build llvm-build --target install

      - name: Verify Android LLVM
        run: |
          "${INSTALL_PREFIX}/bin/clang" --version || true
          "${INSTALL_PREFIX}/bin/clang++" --version || true
          "${INSTALL_PREFIX}/bin/llvm-config" --version || true

      - name: Package LLVM + Clang
        run: |
          tar \
            -C "${INSTALL_PREFIX}" \
            -cJf "${GITHUB_WORKSPACE}/llvm-22.1.8-android-x86_64.tar.xz" \
            .

      - name: Upload LLVM artifact
        uses: actions/upload-artifact@v4
        with:
          name: llvm-22.1.8-android-x86_64
          path: llvm-22.1.8-android-x86_64.tar.xz
          if-no-files-found: error


  # ==========================================================================
  # libclc - native Ubuntu build
  # ==========================================================================
  build-libclc:
    name: Build libclc
    runs-on: ubuntu-24.04

    env:
      INSTALL_PREFIX: "${{ github.workspace }}/libclc-install"

    steps:
      - name: Install prerequisites
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            wget \
            ca-certificates \
            git \
            cmake \
            ninja-build \
            tar \
            xz-utils \
            python3 \
            python3-mako \
            python3-markdown

      - name: Install LLVM 22
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22

      - name: Install LLVM 22 development packages
        run: |
          sudo apt-get install -y \
            llvm-22 \
            llvm-22-dev \
            llvm-22-tools \
            clang-22 \
            clang-tools-22 \
            libclang-common-22-dev \
            libclang-22-dev \
            libclang1-22 \
            lld-22 \
            libclang-rt-22-dev

      - name: Clone LLVM
        run: |
          git clone \
            --depth=1 \
            --branch "${LLVM_TAG}" \
            https://github.com/llvm/llvm-project.git

      - name: Verify LLVM
        run: |
          /usr/lib/llvm-22/bin/llvm-config --version
          /usr/lib/llvm-22/bin/clang --version

      - name: Configure libclc
        run: |
          cmake \
            -S llvm-project/libclc \
            -B libclc-build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${INSTALL_PREFIX}" \
            -DLLVM_DIR="/usr/lib/llvm-22/lib/cmake/llvm" \
            -DCMAKE_C_COMPILER=/usr/lib/llvm-22/bin/clang \
            -DCMAKE_CXX_COMPILER=/usr/lib/llvm-22/bin/clang++

      - name: Build libclc
        run: |
          cmake \
            --build libclc-build \
            --parallel 12

      - name: Install libclc
        run: |
          cmake --install libclc-build

      - name: Verify libclc
        run: |
          find "${INSTALL_PREFIX}" -maxdepth 4 -type f | sort

      - name: Package libclc
        run: |
          tar \
            -C "${INSTALL_PREFIX}" \
            -cJf "${GITHUB_WORKSPACE}/libclc-22.1.8.tar.xz" \
            .

      - name: Upload libclc artifact
        uses: actions/upload-artifact@v4
        with:
          name: libclc-22.1.8
          path: libclc-22.1.8.tar.xz
          if-no-files-found: error


  # ==========================================================================
  # One release containing BOTH artifacts
  # ==========================================================================
  release:
    name: Create Release
    runs-on: ubuntu-24.04

    needs:
      - build-llvm-android
      - build-libclc

    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download LLVM artifact
        uses: actions/download-artifact@v4
        with:
          name: llvm-22.1.8-android-x86_64
          path: release

      - name: Download libclc artifact
        uses: actions/download-artifact@v4
        with:
          name: libclc-22.1.8
          path: release

      - name: Show release files
        run: |
          ls -lh release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/llvm-22.1.8-android-x86_64.tar.xz
            release/libclc-22.1.8.tar.xz
          generate_release_notes: true
