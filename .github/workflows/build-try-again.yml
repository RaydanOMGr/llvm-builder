name: Build libclc workflow 2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      LLVM_VERSION: "22"
      LLVM_TAG: "llvmorg-22.1.8"
      INSTALL_PREFIX: "${{ github.workspace }}/libclc-install"

    steps:
      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            wget \
            ca-certificates \
            git \
            cmake \
            ninja-build \
            tar \
            xz-utils

      - name: Install LLVM 22
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22

      - name: Install LLVM 22 development packages
        run: |
          sudo apt-get install -y \
            llvm-22 \
            llvm-22-dev \
            llvm-22-tools \
            clang-22 \
            clang-tools-22 \
            clang-22-doc \
            libclang-common-22-dev \
            libclang-22-dev \
            libclang1-22 \
            lld-22 \
            lldb-22 \
            libclang-rt-22-dev \
            libc++-22-dev \
            libc++abi-22-dev \
            libomp-22-dev

      - name: Clone llvm-project
        run: |
          git clone \
            --depth 1 \
            --branch "${LLVM_TAG}" \
            https://github.com/llvm/llvm-project.git

      - name: Verify LLVM
        run: |
          /usr/lib/llvm-22/bin/llvm-config --version
          /usr/lib/llvm-22/bin/clang --version

      - name: Configure libclc
        run: |
          cmake \
            -S llvm-project/libclc \
            -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${INSTALL_PREFIX}" \
            -DLLVM_DIR="/usr/lib/llvm-22/lib/cmake/llvm"

      - name: Build libclc
        run: |
          cmake --build build --parallel

      - name: Install libclc
        run: |
          cmake --install build

      - name: Package libclc
        run: |
          tar \
            -C "${INSTALL_PREFIX}" \
            -cJf "${GITHUB_WORKSPACE}/libclc-22.1.8-ubuntu-24.04-x86_64.tar.xz" \
            .

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: libclc-22.1.8
          path: libclc-22.1.8-ubuntu-24.04-x86_64.tar.xz
          if-no-files-found: error

      - name: Create GitHub Release
        env:
         GH_TOKEN: ${{ github.token }}
        run: |
          gh release create \
            "libclc-22.1.8" \
            "libclc-22.1.8-ubuntu-24.04-x86_64.tar.xz" \
           --repo "${{ github.repository }}" \
           --title "libclc 22.1.8" \
           --generate-notes
